[package]
name = "blueeconomy-waterway-safety"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Integrity validation for approved Blue Economy waterway safety telemetry"
license = "UNLICENSED"
publish = false

[features]
default = []
# Primary uplink: real Fluvio producer for ferries.telemetry.v1 (Workstream B
# §3.2). Pinned; pulls the Fluvio client stack (openssl vendored TLS + native
# record compression). Not part of the MSRV-1.75 default build.
fluvio-transport = ["dep:fluvio", "dep:fluvio-future"]
# Fallback uplink: blocking Kafka producer for the same topic, selected by
# config only (Dapr-style transport swap). Pinned; small dependency tree.
kafka-transport = ["dep:kafka"]
# Device-plane uplink (PRA-088 remainder): MQTT publish to the EMQX broker
# with device-credential auth (geo-service /v1/devices/mqtt-auth contract:
# clientid = registered device id, password = Ed25519 signed proof over the
# JCS-canonical {"action":"MQTT_AUTH",...} payload). Pinned; rustls TLS for
# the MQTTS listener. Not part of the MSRV-1.75 default build.
mqtt-transport = ["dep:rumqttc"]

[dependencies]
base64 = "0.23.1"
fluvio = { version = "=0.23.4", optional = true, default-features = false, features = [
    "openssl",
    "compress",
] }
fluvio-future = { version = "=0.7.2", optional = true, default-features = false, features = [
    "task",
] }
kafka = { version = "=0.9.0", optional = true }
rumqttc = { version = "=0.24.0", optional = true, default-features = false, features = [
    "use-rustls",
] }
# Single-threaded runtime driving the rumqttc event loop (mqtt-transport)
# and the OTLP gRPC export worker (telemetry); the public uplink surface
# stays synchronous. Mandatory since the Phase-7 OTel wave — telemetry is
# still disabled (no-op) unless OTEL_EXPORTER_OTLP_ENDPOINT is set.
tokio = { version = "=1.38.1", default-features = false, features = [
    "rt",
    "time",
] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
# Explicitly pinned because newer zeroize releases require Cargo edition-2024 support,
# while this service maintains the declared Rust 1.75 minimum toolchain.
zeroize = "=1.7.0"
base64ct = "=1.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
# Phase-7 OTel wave: tracing + OTLP gRPC export. Disabled (no-op) unless
# OTEL_EXPORTER_OTLP_ENDPOINT is set; all open-source (Apache-2.0/MIT).
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = [
    "fmt",
    "std",
] }
tracing-opentelemetry = "=0.28.0"
opentelemetry = { version = "=0.27.1", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "=0.27.1", features = ["trace"] }
opentelemetry-otlp = { version = "=0.27.0", default-features = false, features = [
    "trace",
    "grpc-tonic",
] }

[dev-dependencies]
# Already a production dependency; declared here so integration tests can
# construct NMEA timestamps. No new dependency is introduced.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
